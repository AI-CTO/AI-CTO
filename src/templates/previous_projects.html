{% extends "layout.html" %} 
{% block title %}My Previous Projects{% endblock %}

{% block content %}
<div id="projects-container">Loading projects...</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("/get_projects")
      .then((response) => response.json())
      .then((data) => {
        if (!data.projects || !Array.isArray(data.projects)) {
          throw new Error("Invalid project data.");
        }

        const container = document.getElementById("projects-container");
        container.innerHTML = "";

        data.projects.forEach((project) => {
          const projectDiv = document.createElement("div");
          projectDiv.classList.add("project");

          projectDiv.innerHTML = `
            <h3>${project.name}</h3>
            <h3>${project.timestamp}</h3>
            <p><strong>Customer Novelty (x_value):</strong> ${project.x_value}</p>
            <p><strong>Business Novelty (y_value):</strong> ${project.y_value}</p>
            <p><strong>Impact:</strong> ${project.impact}</p>
            <button onclick="window.location.href='/update_project?id=${project.id}'">Edit</button>
            <button onclick="deleteProject(${project.id})">Delete</button>
          `;

          container.appendChild(projectDiv);
        });
      })
      .catch((error) => {
        console.error("Error fetching projects:", error);
        document.getElementById(
          "projects-container"
        ).innerHTML = `<p style="color: red;">Error loading projects.</p>`;
      });
  });

  // Delete project function
  function deleteProject(projectId) {
    if (confirm("Are you sure you want to delete this project?")) {
      fetch(`/delete_project/${projectId}`, {
        method: "DELETE",
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to delete project.");
          }
          alert("Project deleted successfully!");
          window.location.reload(); // Reload the page to update the list of projects
        })
        .catch((error) => {
          console.error("Error deleting project:", error);
          alert("Error deleting project.");
        });
    }
  }
</script>

{% endblock %}
