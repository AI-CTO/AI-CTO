{% extends "layout.html" %} {% block title %}My Previous Projects{% endblock %}
{% block content %}
<div id="projects-container">Loading projects...</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("/get_projects")
      .then((response) => response.json())
      .then((data) => {
        if (!data.projects || !Array.isArray(data.projects)) {
          throw new Error("Invalid project data.");
        }

        const container = document.getElementById("projects-container");
        container.innerHTML = "";

        const table = document.createElement("table");
        table.border = "1";
        table.style.width = "100%";
        table.innerHTML = `
          <thead>
            <tr>
              <th>Name</th>
              <th>Time</th>
              <th>Customer Novelty (x_value)</th>
              <th>Business Novelty (y_value)</th>
              <th>Impact</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="projects-table-body"></tbody>
        `;

        const tableBody = table.querySelector("#projects-table-body");

        data.projects.forEach((project) => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td class="project-title">${project.name}</td>
            <td>${project.timestamp.substring(0, 10)}</td>
            <td>${project.x_value}</td>
            <td>${project.y_value}</td>
            <td>${project.impact}</td>
            <td>
              <button class="edit-btn" onclick="window.location.href='/update_project?id=${
                project.id
              }'">Edit</button>
              <button class="delete-btn" onclick="deleteProject(${
                project.id
              })">Delete</button>
            </td>
          `;

          tableBody.appendChild(row);
        });

        container.appendChild(table);
      })
      .catch((error) => {
        console.error("Error fetching projects:", error);
        document.getElementById(
          "projects-container"
        ).innerHTML = `<p style="color: red;">Error loading projects.</p>`;
      });
  });

  // Delete project function
  function deleteProject(projectId) {
    if (confirm("Are you sure you want to delete this project?")) {
      fetch(`/delete_project/${projectId}`, {
        method: "DELETE",
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to delete project.");
          }
          alert("Project deleted successfully!");
          window.location.reload();
        })
        .catch((error) => {
          console.error("Error deleting project:", error);
          alert("Error deleting project.");
        });
    }
  }
</script>

{% endblock %}
